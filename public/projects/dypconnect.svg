<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dypBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="50%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#090e1a"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#dypBg)"/>

  <!-- Banner Header -->
  <rect x="25" y="25" width="220" height="38" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.25)"/>
  <text x="40" y="49" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#38bdf8">DYPConnect // MERN</text>

  <rect x="585" y="25" width="190" height="38" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(34, 197, 94, 0.25)"/>
  <text x="600" y="49" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#86efac">Status: In Active Dev</text>

  <!-- Visual Mockup Cards -->
  <!-- Student Card -->
  <g transform="translate(60, 110)">
    <rect width="210" height="270" rx="14" fill="url(#blueCard)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
    <circle cx="105" cy="55" r="30" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="105" y="60" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">ST</text>
    <text x="105" y="112" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Student Profile</text>
    <text x="105" y="132" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">B.Tech CSE • 2027</text>
    <line x1="20" y1="155" x2="190" y2="155" stroke="rgba(148, 163, 184, 0.15)"/>
    <rect x="25" y="175" width="160" height="26" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.2)"/>
    <text x="105" y="192" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">Skills &amp; Projects</text>
    <rect x="25" y="215" width="160" height="26" rx="6" fill="#2563eb"/>
    <text x="105" y="232" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffffff">Connect</text>
  </g>

  <!-- Central Feed Card -->
  <g transform="translate(295, 95)">
    <rect width="210" height="300" rx="14" fill="url(#blueCard)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1.5"/>
    <rect x="18" y="20" width="174" height="32" rx="6" fill="rgba(255, 255, 255, 0.05)"/>
    <text x="30" y="41" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">Campus Community Feed</text>
    <line x1="18" y1="65" x2="192" y2="65" stroke="rgba(148, 163, 184, 0.12)"/>
    <circle cx="36" cy="90" r="14" fill="#334155"/>
    <text x="60" y="88" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Prof. Kulkarni</text>
    <text x="60" y="102" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Faculty • CSE Dept</text>
    <rect x="20" y="118" width="170" height="60" rx="6" fill="rgba(15, 23, 42, 0.6)"/>
    <text x="28" y="138" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">Hackathon 2026 registrations</text>
    <text x="28" y="154" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">are now open for students!</text>
    <line x1="18" y1="195" x2="192" y2="195" stroke="rgba(148, 163, 184, 0.12)"/>
    <rect x="25" y="210" width="160" height="26" rx="6" fill="rgba(148, 163, 184, 0.08)"/>
    <text x="105" y="227" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Like • Comment • Share</text>
    <rect x="25" y="248" width="160" height="28" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)"/>
    <text x="105" y="266" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">REST API: /api/posts</text>
  </g>

  <!-- Alumni Card -->
  <g transform="translate(530, 110)">
    <rect width="210" height="270" rx="14" fill="url(#blueCard)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.5"/>
    <circle cx="105" cy="55" r="30" fill="#581c87" stroke="#c084fc" stroke-width="2"/>
    <text x="105" y="60" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">AL</text>
    <text x="105" y="112" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Alumni Network</text>
    <text x="105" y="132" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c084fc">SDE @ Tech Corp</text>
    <line x1="20" y1="155" x2="190" y2="155" stroke="rgba(148, 163, 184, 0.15)"/>
    <rect x="25" y="175" width="160" height="26" rx="6" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.2)"/>
    <text x="105" y="192" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c084fc">Mentorship Available</text>
    <rect x="25" y="215" width="160" height="26" rx="6" fill="#7c3aed"/>
    <text x="105" y="232" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffffff">Message</text>
  </g>
</svg>
